async function dec(raw){var k=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)))}
async function derive(pw){var b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},b,256))}
window.addEventListener('load',async function(){try{var s=localStorage.getItem(K);if(s){var o=JSON.parse(s);show(await dec(u(o.k)));return}}catch(e){try{localStorage.removeItem(K)}catch(_){}}});
document.getElementById('f').onsubmit=async function(e){e.preventDefault();var m=document.getElementById('m');m.textContent='Abriendo…';
 try{var raw=await derive(document.getElementById('p').value);var t=await dec(raw);
  if(document.getElementById('r').checked){try{localStorage.setItem(K,JSON.stringify({s:D.s,k:btoa(String.fromCharCode.apply(null,raw))}))}catch(_){}}
  show(t)}catch(x){m.textContent='Contraseña incorrecta.'}};
